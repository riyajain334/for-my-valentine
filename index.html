<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Bhavik 💖</title>
    <style>
        body {
            /* Purple, Pink, and White gradient mixture */
            background: linear-gradient(135deg, #ffffff 0%, #fbc2eb 50%, #a18cd1 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background 1s ease;
        }

        h1 {
            color: #6a1b9a; /* Deep Purple */
            font-size: 3.5rem;
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .container {
            position: relative;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 15px 40px;
            font-size: 1.3rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: absolute; /* Changed to absolute for better control */
        }

        #yesBtn {
            background-color: #ff69b4; /* Pink */
            color: white;
            left: calc(50% - 110px); /* Centered positioning */
        }

        #noBtn {
            background-color: #ffffff;
            color: #6a1b9a; /* Purple text */
            border: 2px solid #6a1b9a;
            left: calc(50% + 20px); /* Centered positioning */
            transition: all 0.2s ease; /* Smooth jump */
        }

        .celebration {
            display: none;
            text-align: center;
            z-index: 10;
        }

        .heart {
            position: fixed;
            top: -10%;
            font-size: 24px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }
    </style>
</head>
<body>

    <audio id="valentineMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="main-content">
        <h1>Bhavik, will you be my Valentine? 💖</h1>
        <div class="container">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO</button>
        </div>
    </div>

    <div id="celebration" class="celebration">
        <h1>Yay! See you on the 14th, Bhavik! 🥰✨</h1>
        <p style="color: #6a1b9a; font-size: 1.8rem; font-weight: bold;">I love you!</p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = Math.random() > 0.5 ? '💜' : '💖'; // Purple and Pink hearts
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        setInterval(createHeart, 300);

        function moveButton() {
            const btn = document.getElementById('noBtn');
            
            // This math ensures the button stays inside the visible screen
            const padding = 50; 
            const maxX = window.innerWidth - btn.offsetWidth - padding;
            const maxY = window.innerHeight - btn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
        }

        function celebrate() {
            const music = document.getElementById('valentineMusic');
            music.play();
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.background = "#6a1b9a"; 
            document.querySelector('#celebration h1').style.color = "white";
            document.querySelector('#celebration p').style.color = "#fbc2eb";
            setInterval(createHeart, 100);
        }
    </script>
</body>
</html>
