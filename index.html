<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question 💖</title>
    <style>
        body {
            background-color: #fff0f5; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            transition: background-color 1s ease;
        }

        h1 {
            color: #ff69b4;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 30px;
            z-index: 10;
            text-shadow: 2px 2px white;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn {
            background-color: #ff69b4;
            color: white;
            margin-right: 20px;
        }

        #noBtn {
            background-color: #ffffff;
            color: #ff69b4;
            border: 2px solid #ff69b4;
            position: absolute;
            transition: 0.1s;
        }

        .celebration {
            display: none;
            text-align: center;
            z-index: 10;
        }

        /* Heart Animation Style */
        .heart {
            position: fixed;
            top: -10%;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <audio id="valentineMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="main-content">
        <h1>Will you be my Valentine? 💖</h1>
        <div class="container">
            <button id="yesBtn" onclick="celebrate()">YES</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">NO</button>
        </div>
    </div>

    <div id="celebration" class="celebration">
        <h1>Yay! See you on the 14th! 🥰✨</h1>
        <p style="color: white; font-size: 1.5rem;">I love you!</p>
    </div>

    <script>
        // 1. Falling Hearts Effect
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Create hearts every 300ms
        setInterval(createHeart, 300);

        // 2. The Elusive "No" Button
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        // 3. The Big "Yes" Moment
        function celebrate() {
            // Play Music
            const music = document.getElementById('valentineMusic');
            music.play();

            // Change UI
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('celebration').style.display = 'block';
            document.body.style.backgroundColor = "#ff1493"; // Deep Pink
            
            // Speed up the hearts for a party effect!
            setInterval(createHeart, 100);
        }
    </script>
</body>
</html>
